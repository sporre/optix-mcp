# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - endpoint
      - headers
    properties:
      endpoint:
        type: string
        description: Optix GraphQL API endpoint.
        default: "https://api.optixapp.com/graphql"
      headers:
        type: string
        description: JSON string of HTTP headers, e.g. {"Authorization":"Bearer YOUR_OPTIX_TOKEN"}
      allowMutations:
        type: string
        enum: ["true", "false"]
        default: "false"
        description: Set to "true" to enable mutation tools (create/cancel bookings, create members). Defaults to "false" for read-only safety.
  commandFunction:
    |-
    (config) => ({
      command: 'bun',
      args: ['run', '/usr/src/app/dist/index.js'],
      env: {
        ENDPOINT: config.endpoint,
        HEADERS: config.headers,
        ALLOW_MUTATIONS: config.allowMutations || 'false'
      }
    })
